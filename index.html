<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Connections ♡</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #fff7fb,
          #f8f4ff,
          #f5fbff
        );

      color: #333;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 40px 15px;

      overflow-x: hidden;
    }


    /* =========================
       BACKGROUND SPARKLES
    ========================= */

    .decoration {
      position: fixed;

      pointer-events: none;

      z-index: 0;

      opacity: 0.7;

      animation:
        floating 5s ease-in-out infinite;
    }


    .sparkle {
      font-size: 25px;
    }


    .cat {
      font-size: 28px;
    }


    .d1 {
      top: 7%;
      left: 7%;
    }


    .d2 {
      top: 16%;
      right: 8%;

      animation-delay: 1s;
    }


    .d3 {
      bottom: 10%;
      left: 8%;

      animation-delay: 2s;
    }


    .d4 {
      bottom: 16%;
      right: 7%;

      animation-delay: 3s;
    }


    .d5 {
      top: 45%;
      left: 3%;

      animation-delay: 1.5s;
    }


    .d6 {
      top: 55%;
      right: 4%;

      animation-delay: 2.5s;
    }


    @keyframes floating {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(0deg);

      }


      50% {

        transform:
          translateY(-15px)
          rotate(8deg);

      }

    }



    /* =========================
       MAIN GAME
    ========================= */

    .game-container {

      width: 100%;
      max-width: 720px;

      text-align: center;

      position: relative;

      z-index: 2;

    }

      font-size: 42px;

      margin
