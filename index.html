<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Connections 🧩</title>

<style>

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f7f6f2;
    color: #111;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 15px;
  }

  .game-container {
    width: 100%;
    max-width: 650px;
    text-align: center;
  }

  h1 {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 16px;
    margin-bottom: 30px;
    color: #555;
  }

  /* SOLVED GROUPS */

  #solved-groups {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }

  .solved-group {
    border-radius: 8px;
    padding: 16px 12px;
    font-weight: bold;

    min-height: 75px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    animation: appear 0.4s ease;
  }

  .category {
    font-size: 18px;
    text-transform: uppercase;
  }

  .group-words {
    margin-top: 7px;
    font-size: 13px;
    font-weight: normal;
  }

  /* CONNECTIONS GRID */

  .grid {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 8px;
  }

  .tile {
    border: none;
    border-radius: 7px;

    background: #efefe6;

    min-height: 78px;

    padding: 8px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    transition:
      transform 0.15s ease,
      background 0.15s ease;
  }

  .tile:hover {
    transform: scale(1.02);
  }

  .tile.selected {
    background: #5a594e;
    color: white;
  }

  .tile:disabled {
    cursor: default;
  }

  /* BUTTONS */

  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;

    margin-top: 25px;
  }

  button.action-button {
    border: none;
    border-radius: 25px;

    padding: 13px 25px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    background: #111;
    color: white;

    transition: transform 0.15s ease;
  }

  button.action-button:hover {
    transform: scale(1.04);
  }

  button.action-button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #shuffle-btn {
    background: #d8d7cf;
    color: #111;
  }

  /* MESSAGE */

  #message {
    min-height: 30px;

    margin-top: 20px;

    font-size: 15px;
    font-weight: bold;
  }

  .wrong {
    animation: shake 0.4s ease;
  }

  /* FINAL SCREEN */

  #final-screen {
    display: none;

    margin-top: 25px;

    padding: 25px;

    border-radius: 15px;

    background: white;

    animation: appear 0.8s ease;
  }

  #final-screen h2 {
    font-size: 35px;
    margin: 0 0 15px;
  }

  #final-screen p {
    font-size: 16px;
    line-height: 1.5;
  }

  .continue-button {
    margin-top: 15px;

    border: none;
    border-radius: 25px;

    padding: 13px 28px;

    background: #111;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
  }

  /* ANIMATIONS */

  @keyframes appear {

    from {
      opacity: 0;
      transform: scale(0.96);
    }

    to {
      opacity: 1;
      transform: scale(1);
    }

  }

  @keyframes shake {

    0% {
      transform: translateX(0);
    }

    25% {
      transform: translateX(-7px);
    }

    50% {
      transform: translateX(7px);
    }

    75% {
      transform: translateX(-5px);
    }

    100% {
      transform: translateX(0);
    }

  }

  /* MOBILE */

  @media (max-width: 500px) {

    h1 {
      font-size: 27px;
    }

    .grid {
      gap: 6px;
    }

    .tile {
      min-height: 70px;
      font-size: 12px;
    }

    .buttons {
      gap: 8px;
    }

    button.action-button {
      padding: 12px 18px;
    }

  }

</style>
</head>


<body>


<div class="game-container">

  <h1>Connections 🧩</h1>

  <div class="subtitle">
    Find four groups of four!
  </div>


  <!-- SOLVED GROUPS WILL APPEAR HERE -->

  <div id="solved-groups"></div>


  <!-- THE 4 x 4 WORD GRID -->

  <div class="grid" id="grid"></div>


  <!-- BUTTONS -->

  <div class="buttons">

    <button
      class="action-button"
      id="shuffle-btn"
      onclick="shuffleTiles()"
    >
      Shuffle
    </button>


    <button
      class="action-button"
      id="deselect-btn"
      onclick="deselectAll()"
    >
      Deselect All
    </button>


    <button
      class="action-button"
      id="submit-btn"
      onclick="checkAnswer()"
      disabled
    >
      Submit
    </button>

  </div>


  <!-- WRONG / CORRECT MESSAGE -->

  <div id="message"></div>


  <!-- FINAL BIRTHDAY SCREEN -->

  <div id="final-screen">

    <h2>YOU DID IT 🎉</h2>

    <p>
      You solved all the connections...
    </p>

    <p>
      <strong>HAPPY BIRTHDAY TUNA 💗</strong>
    </p>

    <p>
      ILY 🫶
    </p>

    <button
      class="continue-button"
      onclick="birthdayMessage()"
    >
      Continue →
    </button>

  </div>

</div>



<script>


/* =========================================================

   ✨ THIS IS THE MAIN SECTION YOU WILL EDIT ✨

   Each group needs:

   1. category:
      What appears when she solves that group.

   2. words:
      The four words that belong to that category.

   IMPORTANT:
   You need exactly 4 groups with exactly 4 words each.

========================================================= */


const groups = [

  {

    category: "REPLACE WITH CATEGORY 1",

    words: [
      "WORD 1",
      "WORD 2",
      "WORD 3",
      "WORD 4"
    ]

  },


  {

    category: "REPLACE WITH CATEGORY 2",

    words: [
      "WORD 5",
      "WORD 6",
      "WORD 7",
      "WORD 8"
    ]

  },


  {

    category: "REPLACE WITH CATEGORY 3",

    words: [
      "WORD 9",
      "WORD 10",
      "WORD 11",
      "WORD 12"
    ]

  },


  {

    category: "REPLACE WITH CATEGORY 4",

    words: [
      "WORD 13",
      "WORD 14",
      "WORD 15",
      "WORD 16"
    ]

  }

];



/* =========================================================

   🎂 FINAL REVEAL

   AFTER ALL FOUR GROUPS ARE SOLVED...

   Their category names will change into these.

   They will ALWAYS appear in this order:

   HAPPY
   BIRTHDAY
   TUNA
   ILY

   Change these to whatever you want.

========================================================= */


const finalReveal = [

  "HAPPY 🎉",
  "BIRTHDAY 🎂",
  "TUNA 💗",
  "ILY 🫶"

];



/* =========================================================

   🎨 COLOURS FOR THE FOUR GROUPS

   You can change these later if you want.

========================================================= */


const groupColors = [

  "#f9df6d",
  "#a0c35a",
  "#b0c4ef",
  "#ba81c5"

];



/* =========================================================

   GAME CODE

   You don't need to touch anything below this line
   unless you want to customise the game further.

========================================================= */


let remainingWords = [];

let selectedWords = [];

let solvedGroups = [];



/* CREATE THE GAME */


function startGame() {

  remainingWords = [];

  selectedWords = [];

  solvedGroups = [];


  groups.forEach(group => {

    group.words.forEach(word => {

      remainingWords.push(word);

    });

  });


  shuffleArray(remainingWords);

  renderGrid();

}



/* SHUFFLE FUNCTION */


function shuffleArray(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(
      Math.random() * (i + 1)
    );


    [array[i], array[j]] =
      [array[j], array[i]];

  }

}



/* DISPLAY THE WORD GRID */


function renderGrid() {

  const grid = document.getElementById("grid");

  grid.innerHTML = "";


  remainingWords.forEach(word => {

    const tile = document.createElement("button");


    tile.classList.add("tile");


    tile.textContent = word;


    if (selectedWords.includes(word)) {

      tile.classList.add("selected");

    }


    tile.onclick = function() {

      selectWord(word);

    };


    grid.appendChild(tile);

  });


  updateSubmitButton();

}



/* SELECT / DESELECT WORD */


function selectWord(word) {

  const index = selectedWords.indexOf(word);


  if (index > -1) {

    selectedWords.splice(index, 1);

  }


  else {

    if (selectedWords.length < 4) {

      selectedWords.push(word);

    }

  }


  renderGrid();

}



/* ENABLE SUBMIT ONLY WHEN 4 WORDS ARE SELECTED */


function updateSubmitButton() {

  const submitButton =
    document.getElementById("submit-btn");


  submitButton.disabled =
    selectedWords.length !== 4;

}



/* DESELECT EVERYTHING */


function deselectAll() {

  selectedWords = [];

  renderGrid();


  document.getElementById("message")
    .textContent = "";

}



/* SHUFFLE BUTTON */


function shuffleTiles() {

  shuffleArray(remainingWords);

  selectedWords = [];

  renderGrid();


  document.getElementById("message")
    .textContent = "";

}



/* CHECK IF THE FOUR SELECTED WORDS ARE A CORRECT GROUP */


function checkAnswer() {

  const message =
    document.getElementById("message");


  let correctGroupIndex = -1;


  groups.forEach((group, index) => {


    if (solvedGroups.includes(index)) {

      return;

    }


    const isCorrect =

      group.words.length === selectedWords.length

      &&

      group.words.every(word =>
        selectedWords.includes(word)
      );


    if (isCorrect) {

      correctGroupIndex = index;

    }


  });



  /* IF CORRECT */


  if (correctGroupIndex !== -1) {

    const group =
      groups[correctGroupIndex];


    solvedGroups.push(
      correctGroupIndex
    );


    message.textContent =
      "Correct! 🎉";


    /* REMOVE THE FOUR WORDS */

    remainingWords =
      remainingWords.filter(word =>

        !group.words.includes(word)

      );


    selectedWords = [];


    renderSolvedGroup(
      group,
      correctGroupIndex
    );


    renderGrid();


    /* CHECK IF GAME IS FINISHED */


    if (solvedGroups.length === 4) {

      setTimeout(() => {

        showFinalReveal();

      }, 700);

    }


  }


  /* IF WRONG */


  else {

    message.textContent =
      "Not quite... try again 👀";


    const grid =
      document.getElementById("grid");


    grid.classList.remove("wrong");


    void grid.offsetWidth;


    grid.classList.add("wrong");

  }

}



/* DISPLAY A SOLVED CATEGORY */


function renderSolvedGroup(
  group,
  groupIndex
) {

  const solvedContainer =
    document.getElementById(
      "solved-groups"
    );


  const solvedGroup =
    document.createElement("div");


  solvedGroup.classList.add(
    "solved-group"
  );


  solvedGroup.style.background =
    groupColors[groupIndex];


  solvedGroup.dataset.groupIndex =
    groupIndex;


  const category =
    document.createElement("div");


  category.classList.add("category");


  category.textContent =
    group.category;


  const groupWords =
    document.createElement("div");


  groupWords.classList.add(
    "group-words"
  );


  groupWords.textContent =
    group.words.join(", ");


  solvedGroup.appendChild(category);

  solvedGroup.appendChild(groupWords);


  solvedContainer.appendChild(
    solvedGroup
  );

}



/* =========================================================

   🎉 FINAL REVEAL

   This happens once ALL 4 groups have been solved.

   The categories change to:

   HAPPY
   BIRTHDAY
   TUNA
   ILY

========================================================= */


function showFinalReveal() {

  const message =
    document.getElementById("message");


  message.textContent = "";


  const solvedElements =
    document.querySelectorAll(
      ".solved-group"
    );


  /* CHANGE EACH CATEGORY ONE BY ONE */


  solvedElements.forEach(
    (element, index) => {


      setTimeout(() => {


        const category =
          element.querySelector(
            ".category"
          );


        const words =
          element.querySelector(
            ".group-words"
          );


        /* LITTLE DISAPPEAR / REVEAL EFFECT */


        element.style.transform =
          "scale(0.96)";


        element.style.opacity =
          "0";


        setTimeout(() => {


          category.textContent =
            finalReveal[index];


          words.textContent =
            "";


          element.style.transform =
            "scale(1)";


          element.style.opacity =
            "1";


        }, 250);


      }, index * 700);


    }

  );


  /* SHOW FINAL SCREEN AFTER ALL REVEALS */


  setTimeout(() => {


    document.getElementById(
      "final-screen"
    ).style.display = "block";


  }, 3500);

}



/* =========================================================

   CONTINUE BUTTON

   You can change what happens here.

========================================================= */


function birthdayMessage() {


  alert(
    "PUT YOUR NEXT BIRTHDAY PAGE HERE 💗"
  );


  /*
  
  LATER, IF YOU HAVE ANOTHER SECTION ON YOUR WEBSITE,
  YOU CAN REPLACE THE ALERT ABOVE WITH SOMETHING LIKE:

  window.location.href = "#birthday-message";

  */


}



/* START THE GAME */


startGame();


</script>


</body>
</html>
